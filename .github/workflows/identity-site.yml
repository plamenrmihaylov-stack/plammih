name: Identity website validation

on:
  pull_request:
    branches: [main]
    paths:
      - "server.mjs"
      - "public/**"
      - "tests/server.test.mjs"
      - "Dockerfile"
      - ".github/workflows/identity-site.yml"
  push:
    branches: [main]
    paths:
      - "server.mjs"
      - "public/**"
      - "tests/server.test.mjs"
      - "Dockerfile"
      - ".github/workflows/identity-site.yml"

permissions:
  contents: read

concurrency:
  group: identity-site-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Validate server and identity site
        run: node --test tests/server.test.mjs
