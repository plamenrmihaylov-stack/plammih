# Explicit replica release pipeline. Invoke manually after target and origin verification.
# This is the active organizational replica, not the primary production target.
substitutions:
  _EXPECTED_PROJECT_ID: driven-crawler-502217f6
  _GKE_LOCATION: europe-west1
  _GKE_CLUSTER: plammih-gke
  _AR_LOCATION: europe-west1
  _AR_REPOSITORY: dunesub-artifact-repo
  _IMAGE_TAG: REPLACE_WITH_REVIEWED_COMMIT_SHA

steps:
  - id: Verify replica deployment target
    name: gcr.io/google.com/cloudsdktool/google-cloud-cli:stable
    entrypoint: bash
    args:
      - -ceu
      - |
        if [[ "$PROJECT_ID" != "${_EXPECTED_PROJECT_ID}" ]]; then
          echo "Refusing replica deployment: Cloud Build project '$PROJECT_ID' is not expected project '${_EXPECTED_PROJECT_ID}'." >&2
          exit 1
        fi
        if [[ "${_IMAGE_TAG}" == "REPLACE_WITH_REVIEWED_COMMIT_SHA" ]]; then
          echo "Refusing deployment: provide _IMAGE_TAG from a reviewed build." >&2
          exit 1
        fi
        gcloud container clusters describe "${_GKE_CLUSTER}" \
          --project="${_EXPECTED_PROJECT_ID}" \
          --location="${_GKE_LOCATION}" \
          --format='value(name)' | grep -Fx "${_GKE_CLUSTER}"

  - id: Deploy reviewed image to organizational replica
    name: gcr.io/google-containers/gke-deploy
    args:
      - run
      - --filename=k8s
      - --image=${_AR_LOCATION}-docker.pkg.dev/${_EXPECTED_PROJECT_ID}/${_AR_REPOSITORY}/plammih:${_IMAGE_TAG}
      - --project=${_EXPECTED_PROJECT_ID}
      - --location=${_GKE_LOCATION}
      - --cluster=${_GKE_CLUSTER}

options:
  logging: CLOUD_LOGGING_ONLY
