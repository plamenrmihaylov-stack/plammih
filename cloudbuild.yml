# Build and publish a uniquely tagged plammih image. This pipeline does not deploy to GKE.
substitutions:
  _AR_LOCATION: europe-west1
  _AR_REPOSITORY: dunesub-artifact-repo

steps:
  - id: Build container
    name: gcr.io/cloud-builders/docker
    args:
      - build
      - -t
      - ${_AR_LOCATION}-docker.pkg.dev/$PROJECT_ID/${_AR_REPOSITORY}/plammih:$SHORT_SHA
      - .

  - id: Push container
    name: gcr.io/cloud-builders/docker
    args:
      - push
      - ${_AR_LOCATION}-docker.pkg.dev/$PROJECT_ID/${_AR_REPOSITORY}/plammih:$SHORT_SHA

images:
  - ${_AR_LOCATION}-docker.pkg.dev/$PROJECT_ID/${_AR_REPOSITORY}/plammih:$SHORT_SHA

options:
  logging: CLOUD_LOGGING_ONLY
