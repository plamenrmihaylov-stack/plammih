apiVersion: apps/v1
kind: Deployment
metadata:
  name: plammih
  labels:
    app.kubernetes.io/name: plammih
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: plammih
  template:
    metadata:
      labels:
        app.kubernetes.io/name: plammih
    spec:
      containers:
        - name: plammih
          image: europe-west1-docker.pkg.dev/driven-crawler-502217f6/plammih-images/plammih:latest
          ports:
            - name: http
              containerPort: 3000
          env:
            - name: PORT
              value: "3000"
          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 2
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 500m
              memory: 256Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 1000
---
apiVersion: v1
kind: Service
metadata:
  name: plammih
  labels:
    app.kubernetes.io/name: plammih
spec:
  type: LoadBalancer
  selector:
    app.kubernetes.io/name: plammih
  ports:
    - name: http
      port: 80
      targetPort: http
