apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: dunesub-zero-trust-policy
  namespace: default
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: plammih
  policyTypes:
    - Ingress
    - Egress
  ingress:
    # Google Front Ends and Google Cloud health checks for the GCE Ingress.
    - from:
        - ipBlock:
            cidr: 130.211.0.0/22
        - ipBlock:
            cidr: 35.191.0.0/16
      ports:
        - protocol: TCP
          port: 3000
  egress:
    # Permit cluster DNS resolution; all other egress remains denied.
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
